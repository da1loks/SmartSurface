<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура SmartSurface</title>
  <desc id="desc">Веб-интерфейс отправляет команды в ROS 2 на Raspberry Pi 5. ROS 2 передаёт команды Arduino Mega и моторам, получает сканы лидара, а SLAM Toolbox строит карту. Камера используется для экспериментов с компьютерным зрением.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#172d42"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f9f9a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#55d6c2"/></marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a6bbd0"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#edf5fc}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#61ddc9}
      .heading{font-size:27px;font-weight:700}
      .caption{font-size:16px;fill:#aec1d3}
      .nodeTitle{font-size:20px;font-weight:700}
      .nodeSub{font-size:14px;fill:#b6c8d9}
      .tag{font-size:12px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="610" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="155" fill="#27bba7" opacity=".06"/>
  <circle cx="120" cy="530" r="200" fill="#438ac1" opacity=".07"/>
  <text x="64" y="62" class="eyebrow">КАК УСТРОЕН ПРОТОТИП</text>
  <text x="64" y="103" class="heading">Сенсоры → ROS 2 → управление роботом</text>
  <text x="64" y="132" class="caption">Планируемая схема обмена данными в локальной сети и на борту платформы</text>

  <g filter="url(#shadow)">
    <rect x="65" y="205" width="230" height="112" rx="18" fill="#20374d" stroke="#38556d"/>
    <rect x="65" y="205" width="7" height="112" rx="4" fill="url(#teal)"/>
    <text x="91" y="247" class="nodeTitle">Веб-интерфейс</text>
    <text x="91" y="276" class="nodeSub">Команды и просмотр данных</text>
    <text x="91" y="298" class="tag" fill="#61ddc9">ЛОКАЛЬНАЯ СЕТЬ</text>

    <rect x="412" y="187" width="335" height="148" rx="22" fill="#143f4d" stroke="#2b796f" stroke-width="2"/>
    <text x="447" y="232" class="nodeTitle">ROS 2</text>
    <text x="447" y="262" class="nodeSub">Raspberry Pi 5 · узлы и обмен данными</text>
    <rect x="447" y="285" width="112" height="27" rx="13" fill="#1b5a60"/>
    <text x="462" y="303" class="tag">КОМАНДЫ</text>
    <rect x="570" y="285" width="143" height="27" rx="13" fill="#1b5a60"/>
    <text x="583" y="303" class="tag">ДАННЫЕ СЕНСОРОВ</text>

    <rect x="854" y="177" width="275" height="103" rx="18" fill="#20374d" stroke="#38556d"/>
    <rect x="854" y="177" width="7" height="103" rx="4" fill="#f2a541"/>
    <text x="880" y="218" class="nodeTitle">Arduino Mega</text>
    <text x="880" y="247" class="nodeSub">Нижний уровень управления</text>

    <rect x="854" y="328" width="275" height="92" rx="18" fill="#20374d" stroke="#38556d"/>
    <rect x="854" y="328" width="7" height="92" rx="4" fill="#f2a541"/>
    <text x="880" y="370" class="nodeTitle">Приводы и моторы</text>
    <text x="880" y="397" class="nodeSub">Колёсная мобильная платформа</text>

    <rect x="412" y="427" width="335" height="92" rx="18" fill="#20374d" stroke="#38556d"/>
    <rect x="412" y="427" width="7" height="92" rx="4" fill="#60a5fa"/>
    <text x="445" y="469" class="nodeTitle">SLAM Toolbox</text>
    <text x="445" y="496" class="nodeSub">Построение карты по сканам лидара</text>

    <rect x="65" y="397" width="230" height="92" rx="18" fill="#20374d" stroke="#38556d"/>
    <rect x="65" y="397" width="7" height="92" rx="4" fill="#60a5fa"/>
    <text x="91" y="438" class="nodeTitle">LDROBOT D500</text>
    <text x="91" y="466" class="nodeSub">Лидар · сканы помещения</text>

    <rect x="854" y="462" width="275" height="83" rx="18" fill="#263448" stroke="#4a5868" stroke-dasharray="6 6"/>
    <text x="880" y="497" class="nodeTitle">Камера</text>
    <text x="880" y="523" class="nodeSub">Эксперименты с компьютерным зрением</text>
  </g>

  <path d="M295 260H398" fill="none" stroke="#55d6c2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="322" y="246" class="nodeSub">HTTP</text>
  <path d="M747 231H840" fill="none" stroke="#55d6c2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="773" y="216" class="nodeSub">Serial</text>
  <path d="M991 280V315" fill="none" stroke="#55d6c2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M295 443H374Q392 443 392 461H398" fill="none" stroke="#a6bbd0" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
  <path d="M580 427V347" fill="none" stroke="#a6bbd0" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
  <path d="M854 503H782Q766 503 766 487H760" fill="none" stroke="#8498aa" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowSoft)"/>
  <text x="64" y="575" class="caption">Схема показывает архитектуру, описанную в материалах проекта; состав узлов ещё предстоит подтвердить кодом и испытаниями.</text>
</svg>
